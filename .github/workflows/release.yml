name: Release DLL

# Two triggers, one build:
#   - push to main: publishes a rolling pre-release per merge, tagged
#     v<version>-build.<run number> so each one is unique (no tag-moving
#     games, no clobbered assets).
#   - workflow_dispatch: the real, human-tagged release.
#
# Both publish the same two files. They are the SAME binary under two
# names: dinput8.dll for a direct drop-in next to the game exe, and
# opendojo.asi for an Ultimate ASI Loader plugins/ folder (the loader only
# picks up *.asi and walks past a .dll). The DLL exports the dinput8 proxy
# surface either way, so one build covers both install methods.
#
# Requires the cloud build secrets configured in repo settings.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the release + tag + upload the assets

jobs:
  build:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # On a manual run the tag is whatever the human typed. On a merge to
      # main, build one from the CMake project version + the run number so
      # it sorts sensibly and never collides with an existing tag.
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9.]\{1,\}\).*/\1/p' dll/CMakeLists.txt | head -1)
            v=${v:-0.0.0}
            echo "tag=v$v-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=v$v (main build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure (cloud-enabled)
        run: >
          cmake -B dll/build -S dll -A x64
          -DOPENDOJO_CLOUD_URL="${{ secrets.OPENDOJO_CLOUD_URL }}"
          -DOPENDOJO_CLOUD_PROXY_KEY="${{ secrets.OPENDOJO_CLOUD_PROXY_KEY }}"

      - name: Build (Release)
        run: cmake --build dll/build --config Release

      # Same bytes, second name — see the header note.
      - name: Stage the .asi copy
        shell: bash
        run: cp dll/build/Release/dinput8.dll dll/build/Release/opendojo.asi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'push' && true || inputs.prerelease }}
          generate_release_notes: true
          files: |
            dll/build/Release/dinput8.dll
            dll/build/Release/opendojo.asi
